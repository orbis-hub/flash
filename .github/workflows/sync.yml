name: sync firmware
on:
  schedule: [{ cron: "17 */6 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node sync.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "orbis-bot"
          git config user.email "bot@orbis-hub"
          git add -A
          git diff --cached --quiet || (git commit -m "sync firmware from latest fw release" && git push)
